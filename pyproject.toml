[project]
name = "buyer-placement-optimizer"
version = "1.0.0"
description = "Place home buyers into ranked neighbourhoods with balanced capacity"
requires-python = ">=3.11"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
